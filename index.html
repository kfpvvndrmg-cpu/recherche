  <!-- Icônes explicites avec paramètre de version (?v=2) pour éviter le conflit de cache entre répertoires GitHub -->
  <link rel="icon" type="image/jpeg" href="./ai-generated-8783105_640.jpg?v=2">
  <link rel="shortcut icon" type="image/jpeg" href="./ai-generated-8783105_640.jpg?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="./ai-generated-8783105_640.jpg?v=2">
  <link id="pwa-manifest" rel="manifest">
  
  <title>Accès Sites</title>
  
  <!-- Script pour isoler cette application des autres répertoires GitHub Pages -->
  <script>
    (function() {
      try {
        if (window.location.protocol.startsWith('http')) {
          const iconUrl = new URL('./ai-generated-8783105_640.jpg?v=2', window.location.href).href;
          const manifest = {
            name: "Accès Sites",
            short_name: "Accès",
            start_url: window.location.href,
            scope: window.location.href,
            display: "standalone",
            background_color: "#07101E",
            theme_color: "#07101E",
            icons: [
              { src: iconUrl, sizes: "192x192", type: "image/jpeg" },
              { src: iconUrl, sizes: "512x512", type: "image/jpeg" }
            ]
          };
          const blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
          const manifestEl = document.getElementById('pwa-manifest');
          if (manifestEl) {
            manifestEl.href = URL.createObjectURL(blob);
          }
        }
      } catch (e) {
        console.warn("Manifeste PWA ignoré dans cet environnement :", e);
      }
    })();
  </script>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Configuration pour charger les modules (React, Icones, Firebase) depuis le navigateur -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.292.0?deps=react@18.2.0",
        "firebase/app": "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js",

      }

  </script>
  
  <!-- Babel (pour traduire le code React/JSX dans le navigateur) -->

  <style>

    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }

<body class="bg-[#07101E]">
  
  <!-- C'est ici que l'application React va s'afficher -->
  <div id="root"></div>

  <!-- Script principal de l'application -->
  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useMemo, useRef } from 'react';
    import { createRoot } from 'react-dom/client';
    import { Search, Plus, X, Copy, ChevronDown, ChevronRight, MapPin, CheckCircle2, LockKeyhole, Folder, Trash2, AlertTriangle, Edit3, Download, Upload, User, KeyRound, Camera, FileText, Eye, Paperclip } from 'lucide-react';

    import { initializeApp } from 'firebase/app';
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from 'firebase/auth';
    import { getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc, writeBatch } from 'firebase/firestore';

    // --- Configuration Firebase ---
    const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
    let app, auth, db;
    const isFirebaseEnabled = firebaseConfig && Object.keys(firebaseConfig).length > 0;
    
    if (isFirebaseEnabled) {
      try {
        app = initializeApp(firebaseConfig);
        auth = getAuth(app);
        db = getFirestore(app);
      } catch(e) {
        console.error("Firebase init fallback", e);
      }
    }
    
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
    const LOCAL_STORAGE_KEY = 'passkeeper_access_codes';

    function App() {
      // --- States ---
      const [user, setUser] = useState(null);
      const [items, setItems] = useState([]);
      const [loading, setLoading] = useState(true);
      const [searchQuery, setSearchQuery] = useState('');
      const [expandedSite, setExpandedSite] = useState(null);
      const [toastMessage, setToastMessage] = useState('');
      const [selectedCodeItem, setSelectedCodeItem] = useState(null);
      const [isAddModalOpen, setIsAddModalOpen] = useState(false);
      const [formData, setFormData] = useState({ siteName: '', subMenu: '', code: '', username: '', password: '', attachments: [null, null, null] });
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [itemToDelete, setItemToDelete] = useState(null);
      const [editModal, setEditModal] = useState({ isOpen: false, type: null, data: null, formData: { siteName: '', subMenu: '', code: '', username: '', password: '', attachments: [null, null, null] } });
      
      const fileInputRef = useRef(null);
      const addPhotoRefs = [useRef(null), useRef(null), useRef(null)];
      const addDocRefs = [useRef(null), useRef(null), useRef(null)];
      const editPhotoRefs = [useRef(null), useRef(null), useRef(null)];
      const editDocRefs = [useRef(null), useRef(null), useRef(null)];

      // Conversion Base64 vers Blob URL instantanée pour lecture native mobile/PC sans ralentissement
      const openAttachmentNative = (att) => {
        if (!att || !att.data) return;
        try {
          if (att.data.startsWith('data:')) {
            const parts = att.data.split(',');
            const mimeMatch = parts[0].match(/:(.*?);/);
            const mime = mimeMatch ? mimeMatch[1] : (att.type || 'application/octet-stream');
            const bstr = atob(parts[1]);
            let n = bstr.length;
            const u8arr = new Uint8Array(n);
            while (n--) {
              u8arr[n] = bstr.charCodeAt(n);
            }
            const blob = new Blob([u8arr], { type: mime });
            const url = URL.createObjectURL(blob);
            const win = window.open(url, '_blank');
            if (!win) {
              const a = document.createElement('a');
              a.href = url;
              a.target = '_blank';
              a.rel = 'noopener noreferrer';
              document.body.appendChild(a);
              a.click();
              document.body.removeChild(a);
            }
            setTimeout(() => URL.revokeObjectURL(url), 60000);
          } else {
            window.open(att.data, '_blank');
          }
        } catch (err) {
          console.error("Erreur d'ouverture du fichier:", err);
          showToast("Impossible d'ouvrir directement, utilisez le bouton télécharger.");
        }
      };

      // Helper pour récupérer la liste normalisée des pièces jointes (compatibilité ancien et nouveau format)
      const getItemAttachments = (item) => {
        if (!item) return [];
        if (Array.isArray(item.attachments)) {
          return item.attachments.filter(Boolean);
        }
        if (item.attachment) {
          return [item.attachment];
        }
        return [];
      };

      // Traitement et compression des photos / fichiers joints
      const processAttachmentFile = (file) => {
        return new Promise((resolve, reject) => {
          if (!file) {
            reject(new Error("Aucun fichier sélectionné."));
            return;
          }

          if (file.type && file.type.startsWith('image/')) {
            const reader = new FileReader();
            reader.onload = (e) => {
              const img = new Image();
              img.onload = () => {
                const canvas = document.createElement('canvas');
                const MAX_SIZE = 1024;
                let width = img.width;
                let height = img.height;

                if (width > height) {
                  if (width > MAX_SIZE) {
                    height *= MAX_SIZE / width;
                    width = MAX_SIZE;
                  }
                } else {
                  if (height > MAX_SIZE) {
                    width *= MAX_SIZE / height;
                    height = MAX_SIZE;
                  }
                }

                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.75);

                resolve({
                  name: file.name || 'photo.jpg',
                  type: 'image/jpeg',
                  data: compressedDataUrl
                });
              };
              img.onerror = reject;
              img.src = e.target.result;
            };
            reader.onerror = reject;
            reader.readAsDataURL(file);
          } else {
            // Pour un PDF ou autre document (limite à ~750 Ko pour rester compatible)
            if (file.size > 750 * 1024) {
              reject(new Error("Fichier trop volumineux (max 750 Ko)."));
              return;
            }
            const reader = new FileReader();
            reader.onload = (e) => {
              resolve({
                name: file.name,
                type: file.type || 'application/octet-stream',
                data: e.target.result
              });
            };
            reader.onerror = reject;
            reader.readAsDataURL(file);
          }
        });
      };

      const handleFileAttachment = async (e, targetMode, slotIndex) => {
        const file = e.target.files[0];
        if (!file) return;
        try {
          const processed = await processAttachmentFile(file);
          if (targetMode === 'add') {
            setFormData(prev => {
              const updated = [...(prev.attachments || [null, null, null])];
              updated[slotIndex] = processed;
              return { ...prev, attachments: updated };
            });
          } else {
            setEditModal(prev => {
              const updated = [...(prev.formData.attachments || [null, null, null])];
              updated[slotIndex] = processed;
              return { ...prev, formData: { ...prev.formData, attachments: updated } };
            });
          }
          showToast(`Document ${slotIndex + 1} prêt !`);
        } catch (err) {
          showToast(err.message || "Erreur lors de l'ajout du fichier.");
        } finally {
          e.target.value = '';
        }
      };

      const removeAttachmentSlot = (targetMode, slotIndex) => {
        if (targetMode === 'add') {
          setFormData(prev => {
            const updated = [...(prev.attachments || [null, null, null])];
            updated[slotIndex] = null;
            return { ...prev, attachments: updated };
          });
        } else {
          setEditModal(prev => {
            const updated = [...(prev.formData.attachments || [null, null, null])];
            updated[slotIndex] = null;
            return { ...prev, formData: { ...prev.formData, attachments: updated } };
          });
        }
      };

      // Helper pour sauvegarder en local quand Firebase n'est pas actif (ex: GitHub Pages)
      const saveToLocal = (newItems) => {
        setItems(newItems);
        localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(newItems));
      };

      // --- Initialisation Auth ou Chargement Local ---
      useEffect(() => {
        if (!isFirebaseEnabled || !auth) {
          try {
            const saved = localStorage.getItem(LOCAL_STORAGE_KEY);
            if (saved) setItems(JSON.parse(saved));
          } catch (e) {
            console.error("Erreur lecture locale:", e);
          }
          setLoading(false);
          return;
        }

        const initAuth = async () => {
          try {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
              await signInWithCustomToken(auth, __initial_auth_token);
            } else {
              await signInAnonymously(auth);
            }
          } catch (error) {
            console.error("Erreur d'authentification:", error);
            setLoading(false);
          }
        };
        initAuth();

        const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
          setUser(currentUser);
        });
        return () => unsubscribe();
      }, []);

      // --- Chargement des données Firestore ---
      useEffect(() => {
        if (!isFirebaseEnabled || !user || !db) return;

        const collectionRef = collection(db, 'artifacts', appId, 'users', user.uid, 'access_codes');
        
        const unsubscribe = onSnapshot(
          collectionRef,
          (snapshot) => {
            const fetchedItems = snapshot.docs.map(doc => ({
              id: doc.id,
              ...doc.data()
            }));
            setItems(fetchedItems);
            setLoading(false);
          },
          (error) => {
            console.error("Erreur Firestore:", error);
            setLoading(false);
          }
        );

        return () => unsubscribe();
      }, [user]);

      // --- Filtrage et regroupement des données ---
      const filteredAndGroupedData = useMemo(() => {
        const grouped = items.reduce((acc, item) => {
          const site = item.siteName || 'Inconnu';
          if (!acc[site]) acc[site] = [];
          acc[site].push(item);
          return acc;
        }, {});

        const sortAlpha = (a, b) => a.localeCompare(b, 'fr', { sensitivity: 'base' });

        Object.keys(grouped).forEach((site) => {
          grouped[site].sort((a, b) => sortAlpha(a.subMenu || '', b.subMenu || ''));
        });

        const sortObjectByKeys = (obj) => {
          return Object.keys(obj)
            .sort(sortAlpha)
            .reduce((sortedAcc, key) => {
              sortedAcc[key] = obj[key];
              return sortedAcc;
            }, {});
        };

        if (!searchQuery) return sortObjectByKeys(grouped);

        const normalize = (str) => {
          return str ? String(str).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase() : "";
        };

        const query = normalize(searchQuery);
        const filtered = {};

        Object.entries(grouped).forEach(([siteName, subMenus]) => {
          const siteMatches = normalize(siteName).includes(query);
          const safeSubMenus = Array.isArray(subMenus) ? subMenus : [];
          
          const matchingSubMenus = safeSubMenus.filter(sub => 
            (sub && sub.subMenu && normalize(sub.subMenu).includes(query)) ||
            (sub && sub.code && normalize(sub.code).includes(query)) ||
            (sub && sub.username && normalize(sub.username).includes(query))
          );

          if (siteMatches) {
            filtered[siteName] = safeSubMenus;
          } else if (matchingSubMenus.length > 0) {
            filtered[siteName] = matchingSubMenus;
          }
        });

        return sortObjectByKeys(filtered);
      }, [items, searchQuery]);

      const uniqueSites = useMemo(() => Object.keys(items.reduce((acc, item) => {
        if (item.siteName) acc[item.siteName] = true;
        return acc;
      }, {})).sort((a, b) => a.localeCompare(b, 'fr', { sensitivity: 'base' })), [items]);

      // --- Actions ---
      const showToast = (message) => {
        setToastMessage(message);
        setTimeout(() => setToastMessage(''), 3000);
      };

      const handleCopyValue = async (value, label = "Valeur") => {
        if (!value) return;
        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(value);
          } else {
            const textArea = document.createElement("textarea");
            textArea.value = value;
            textArea.style.position = "fixed";
            textArea.style.left = "-999999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);
          }
          showToast(`${label} copié dans le presse-papier !`);
        } catch (err) {
          showToast("Erreur lors de la copie.");
        }
      };

      const handleAddSubmit = async (e) => {
        e.preventDefault();
        if (!formData.siteName.trim() || !formData.subMenu.trim()) {
          showToast("Veuillez indiquer au moins la ville/site et le nom de l'accès.");
          return;
        }
        setIsSubmitting(true);
        const cleanAttachments = (formData.attachments || []).filter(Boolean);
        const newEntry = {
          siteName: formData.siteName.trim(),
          subMenu: formData.subMenu.trim(),
          code: formData.code ? formData.code.trim() : '',
          username: formData.username ? formData.username.trim() : '',
          password: formData.password ? formData.password.trim() : '',
          attachments: cleanAttachments
        };

        try {
          if (isFirebaseEnabled && user && db) {
            const collectionRef = collection(db, 'artifacts', appId, 'users', user.uid, 'access_codes');
            await addDoc(collectionRef, newEntry);
          } else {
            const newItemWithId = { id: Date.now().toString(), ...newEntry };
            saveToLocal([...items, newItemWithId]);
          }
          setIsAddModalOpen(false);
          setFormData({ siteName: '', subMenu: '', code: '', username: '', password: '', attachments: [null, null, null] });
          showToast("Accès ajouté avec succès !");
        } catch (error) {
          console.error("Erreur d'ajout:", error);
          showToast("Erreur lors de l'ajout (fichier trop lourd ?).");
        } finally {
          setIsSubmitting(false);
        }
      };

      const toggleSite = (siteName) => {
        setExpandedSite(expandedSite === siteName ? null : siteName);
      };

      const confirmDelete = async () => {
        if (!itemToDelete) return;
        try {
          if (isFirebaseEnabled && user && db) {
            if (itemToDelete.type === 'item') {
              await deleteDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'access_codes', itemToDelete.id));
              showToast("Accès supprimé.");
            } else if (itemToDelete.type === 'site') {
              const batch = writeBatch(db);
              const itemsToDelete = items.filter(i => i.siteName === itemToDelete.siteName);
              itemsToDelete.forEach(item => {
                const docRef = doc(db, 'artifacts', appId, 'users', user.uid, 'access_codes', item.id);
                batch.delete(docRef);
              });
              await batch.commit();
              showToast("Site entier supprimé.");
            }
          } else {
            if (itemToDelete.type === 'item') {
              saveToLocal(items.filter(i => i.id !== itemToDelete.id));
              showToast("Accès supprimé.");
            } else if (itemToDelete.type === 'site') {
              saveToLocal(items.filter(i => i.siteName !== itemToDelete.siteName));
              showToast("Site entier supprimé.");
            }
          }
        } catch (error) {
          console.error("Erreur de suppression:", error);
          showToast("Erreur lors de la suppression.");
        }
        setItemToDelete(null);
      };

      const openEditModal = (type, data) => {
        if (type === 'site') {
          setEditModal({ isOpen: true, type, data, formData: { siteName: data.siteName, subMenu: '', code: '', username: '', password: '', attachments: [null, null, null] } });
        } else {
          const existingAtts = getItemAttachments(data);
          const paddedAtts = [existingAtts[0] || null, existingAtts[1] || null, existingAtts[2] || null];
          setEditModal({ 
            isOpen: true, 
            type, 
            data, 
            formData: { 
              siteName: data.siteName || '', 
              subMenu: data.subMenu || '', 
              code: data.code || '',
              username: data.username || '',
              password: data.password || '',
              attachments: paddedAtts
            } 
          });
        }
      };

      const handleEditSubmit = async (e) => {
        e.preventDefault();
        setIsSubmitting(true);
        const cleanAttachments = (editModal.formData.attachments || []).filter(Boolean);
        try {
          if (isFirebaseEnabled && user && db) {
            if (editModal.type === 'site') {
              const newSiteName = editModal.formData.siteName.trim();
              if (newSiteName && newSiteName !== editModal.data.siteName) {
                const batch = writeBatch(db);
                const itemsToUpdate = items.filter(i => i.siteName === editModal.data.siteName);
                itemsToUpdate.forEach(item => {
                  const docRef = doc(db, 'artifacts', appId, 'users', user.uid, 'access_codes', item.id);
                  batch.update(docRef, { siteName: newSiteName });
                });
                await batch.commit();
                showToast("Site modifié avec succès.");
              }
            } else if (editModal.type === 'item') {
              if (!editModal.formData.siteName.trim() || !editModal.formData.subMenu.trim()) {
                showToast("Le site et le nom de l'accès sont obligatoires.");
                setIsSubmitting(false);
                return;
              }
              const docRef = doc(db, 'artifacts', appId, 'users', user.uid, 'access_codes', editModal.data.id);
              await updateDoc(docRef, {
                siteName: editModal.formData.siteName.trim(),
                subMenu: editModal.formData.subMenu.trim(),
                code: editModal.formData.code ? editModal.formData.code.trim() : '',
                username: editModal.formData.username ? editModal.formData.username.trim() : '',
                password: editModal.formData.password ? editModal.formData.password.trim() : '',
                attachments: cleanAttachments,
                attachment: null
              });
              showToast("Accès modifié avec succès.");
            }
          } else {
            if (editModal.type === 'site') {
              const newSiteName = editModal.formData.siteName.trim();
              if (newSiteName && newSiteName !== editModal.data.siteName) {
                const updated = items.map(i => i.siteName === editModal.data.siteName ? { ...i, siteName: newSiteName } : i);
                saveToLocal(updated);
                showToast("Site modifié avec succès.");
              }
            } else if (editModal.type === 'item') {
              if (!editModal.formData.siteName.trim() || !editModal.formData.subMenu.trim()) {
                showToast("Le site et le nom de l'accès sont obligatoires.");
                setIsSubmitting(false);
                return;
              }
              const updated = items.map(i => i.id === editModal.data.id ? {
                ...i,
                siteName: editModal.formData.siteName.trim(),
                subMenu: editModal.formData.subMenu.trim(),
                code: editModal.formData.code ? editModal.formData.code.trim() : '',
                username: editModal.formData.username ? editModal.formData.username.trim() : '',
                password: editModal.formData.password ? editModal.formData.password.trim() : '',
                attachments: cleanAttachments,
                attachment: undefined
              } : i);
              saveToLocal(updated);
              showToast("Accès modifié avec succès.");
            }
          }
          setEditModal({ isOpen: false, type: null, data: null, formData: { siteName: '', subMenu: '', code: '', username: '', password: '', attachments: [null, null, null] } });
        } catch (error) {
          console.error("Erreur de modification:", error);
          showToast("Erreur lors de la modification.");
        } finally {
          setIsSubmitting(false);
        }
      };

      const handleExport = () => {
        const exportData = items.map(({ id, ...rest }) => rest);
        const dataStr = JSON.stringify(exportData, null, 2);
        const blob = new Blob([dataStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = 'sauvegarde_acces.json';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
        showToast("Sauvegarde exportée !");
      };

      const handleImport = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async (event) => {
          try {
            const importedData = JSON.parse(event.target.result);
            if (Array.isArray(importedData)) {
              const validItems = importedData.filter(item => item.siteName && item.subMenu);
              if (validItems.length > 0) {
                if (isFirebaseEnabled && user && db) {
                  setLoading(true);
                  const batch = writeBatch(db);
                  const collectionRef = collection(db, 'artifacts', appId, 'users', user.uid, 'access_codes');
                  validItems.forEach(item => {
                    const newDocRef = doc(collectionRef);
                    const atts = Array.isArray(item.attachments) ? item.attachments.filter(Boolean) : (item.attachment ? [item.attachment] : []);
                    batch.set(newDocRef, { 
                      siteName: item.siteName, 
                      subMenu: item.subMenu, 
                      code: item.code || '',
                      username: item.username || '',
                      password: item.password || '',
                      attachments: atts
                    });
                  });
                  await batch.commit();
                } else {
                  const newItemsWithIds = validItems.map((item, idx) => {
                    const atts = Array.isArray(item.attachments) ? item.attachments.filter(Boolean) : (item.attachment ? [item.attachment] : []);
                    return {
                      id: (Date.now() + idx).toString(),
                      siteName: item.siteName,
                      subMenu: item.subMenu,
                      code: item.code || '',
                      username: item.username || '',
                      password: item.password || '',
                      attachments: atts

                  });

              }

            }

                                      )}
                                      <span className="text-sm font-medium text-slate-700 truncate">{att.name}</span>
                                    </div>
                                    <button
                                      type="button"
                                      onClick={() => removeAttachmentSlot('add', slotIdx)}
                                      className="p-1.5 text-red-500 hover:bg-red-100 rounded-full shrink-0"
                                      title="Retirer la pièce jointe"
                                    >
                                      <X className="h-4 w-4" />
                                    </button>
                                  </div>
                                )}
                              </div>
                            );
                          })}
                        </div>
                      </form>
                    </div>
                    
                    <div className="p-6 border-t border-slate-100 bg-slate-50/50 rounded-b-3xl shrink-0">
                      <button
                        type="submit"
                        form="add-form"
                        disabled={isSubmitting}
                        className="w-full py-4 bg-blue-600 text-white rounded-xl font-bold text-lg hover:bg-blue-700 active:scale-[0.98] transition-all disabled:opacity-70 flex justify-center items-center shadow-lg shadow-blue-500/30"
                      >
                        {isSubmitting ? (
                          <span className="animate-spin rounded-full h-6 w-6 border-b-2 border-white"></span>
                        ) : (
                          "Enregistrer l'accès"
                        )}
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {/* Modale de modification */}
              {editModal.isOpen && (
                <div className="fixed sm:absolute inset-0 z-50 flex flex-col justify-end sm:justify-center p-0 sm:p-6">
                  <div 
                    className="absolute inset-0 bg-black/60 backdrop-blur-sm"
                    onClick={() => setEditModal({ ...editModal, isOpen: false })}
                  ></div>
                  <div className="bg-white w-full h-[88vh] sm:h-auto sm:max-h-[90vh] rounded-t-3xl sm:rounded-3xl relative z-10 shadow-2xl flex flex-col">
                    
                    <div className="flex items-center justify-between p-6 border-b border-slate-100 shrink-0">
                      <h2 className="text-xl font-bold text-slate-800 flex items-center">
                        <Edit3 className="h-5 w-5 mr-2 text-blue-600" /> 
                        {editModal.type === 'site' ? "Modifier le site" : "Modifier l'accès"}
                      </h2>
                      <button onClick={() => setEditModal({ ...editModal, isOpen: false })} className="p-2 bg-slate-100 rounded-full text-slate-500">
                        <X className="h-5 w-5" />
                      </button>
                    </div>

                    <div className="p-6 flex-1 overflow-y-auto">
                      <form id="edit-form" onSubmit={handleEditSubmit} className="space-y-4">
                        
                        <div className="space-y-1.5">
                          <label className="text-sm font-semibold text-slate-700 ml-1">Ville ou Site *</label>
                          <input
                            list="sites-list-edit"
                            required
                            className="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
                            value={editModal.formData.siteName}
                            onChange={(e) => setEditModal({ ...editModal, formData: { ...editModal.formData, siteName: e.target.value } })}
                          />
                          <datalist id="sites-list-edit">
                            {uniqueSites.map(site => <option key={site} value={site} />)}
                          </datalist>
                          {editModal.type === 'site' && (
                            <p className="text-xs text-slate-500 mt-1 ml-1">
                              Modifier ce nom mettra à jour tous les accès associés à ce site.
                            </p>
                          )}
                        </div>

                        {editModal.type === 'item' && (
                          <>
                            <div className="space-y-1.5">
                              <label className="text-sm font-semibold text-slate-700 ml-1">Nom de l'accès / Sous-menu *</label>
                              <input
                                required
                                className="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
                                value={editModal.formData.subMenu}
                                onChange={(e) => setEditModal({ ...editModal, formData: { ...editModal.formData, subMenu: e.target.value } })}
                              />
                            </div>

                            <div className="space-y-1.5">
                              <label className="text-sm font-semibold text-slate-700 ml-1">Code d'accès (optionnel)</label>
                              <input
                                className="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all font-mono text-base"
                                value={editModal.formData.code}
                                onChange={(e) => setEditModal({ ...editModal, formData: { ...editModal.formData, code: e.target.value } })}
                              />
                            </div>

                            <div className="space-y-1.5">
                              <label className="text-sm font-semibold text-slate-700 ml-1">Identifiant (optionnel)</label>
                              <input
                                className="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
                                value={editModal.formData.username}
                                onChange={(e) => setEditModal({ ...editModal, formData: { ...editModal.formData, username: e.target.value } })}
                              />
                            </div>

                            <div className="space-y-1.5">
                              <label className="text-sm font-semibold text-slate-700 ml-1">Mot de passe (optionnel)</label>
                              <input
                                className="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all font-mono text-base"
                                value={editModal.formData.password}
                                onChange={(e) => setEditModal({ ...editModal, formData: { ...editModal.formData, password: e.target.value } })}
                              />
                            </div>

                            {/* Section 3 Lignes Photos ou Documents (Modification) */}
                            <div className="space-y-3 pt-1">
                              <label className="text-sm font-semibold text-slate-700 ml-1 block">Photos ou Documents (jusqu'à 3)</label>
                              {[0, 1, 2].map((slotIdx) => {
                                const att = editModal.formData.attachments?.[slotIdx];
                                return (
                                  <div key={slotIdx} className="space-y-1">
                                    <input type="file" accept="image/*" capture="environment" ref={editPhotoRefs[slotIdx]} onChange={(e) => handleFileAttachment(e, 'edit', slotIdx)} className="hidden" />
                                    <input type="file" accept="image/*,application/pdf,.doc,.docx,.txt" ref={editDocRefs[slotIdx]} onChange={(e) => handleFileAttachment(e, 'edit', slotIdx)} className="hidden" />

                                    {!att ? (
                                      <div className="grid grid-cols-2 gap-2.5">
                                        <button
                                          type="button"
                                          onClick={() => editPhotoRefs[slotIdx].current?.click()}
                                          className="flex items-center justify-center gap-2 p-3 bg-blue-50 text-blue-700 border border-blue-200 rounded-xl font-semibold text-xs sm:text-sm hover:bg-blue-100 active:scale-95 transition-all"
                                        >
                                          <Camera className="h-4 w-4 shrink-0" />
                                          <span>Photo {slotIdx + 1}</span>
                                        </button>
                                        <button
                                          type="button"
                                          onClick={() => editDocRefs[slotIdx].current?.click()}
                                          className="flex items-center justify-center gap-2 p-3 bg-slate-100 text-slate-700 border border-slate-200 rounded-xl font-semibold text-xs sm:text-sm hover:bg-slate-200 active:scale-95 transition-all"
                                        >
                                          <FileText className="h-4 w-4 shrink-0" />
                                          <span>Document {slotIdx + 1}</span>
                                        </button>
                                      </div>
                                    ) : (
                                      <div className="flex items-center justify-between p-2.5 bg-blue-50/70 border border-blue-200 rounded-xl">
                                        <div className="flex items-center space-x-3 min-w-0">
                                          {att.type?.startsWith('image/') ? (
                                            <img src={att.data} alt="Aperçu" className="h-9 w-9 rounded-lg object-cover shrink-0 border border-blue-200" />
                                          ) : (
                                            <div className="p-2 bg-blue-100 text-blue-600 rounded-lg shrink-0">
                                              <FileText className="h-4 w-4" />
                                            </div>
                                          )}
                                          <span className="text-sm font-medium text-slate-700 truncate">{att.name}</span>
                                        </div>
                                        <button
                                          type="button"
                                          onClick={() => removeAttachmentSlot('edit', slotIdx)}
                                          className="p-1.5 text-red-500 hover:bg-red-100 rounded-full shrink-0"
                                          title="Retirer la pièce jointe"
                                        >
                                          <X className="h-4 w-4" />
                                        </button>
                                      </div>
                                    )}
                                  </div>
                                );
                              })}
                            </div>
                          </>
                        )}
                      </form>
                    </div>
                    
                    <div className="p-6 border-t border-slate-100 bg-slate-50/50 rounded-b-3xl shrink-0">
                      <button
                        type="submit"
                        form="edit-form"
                        disabled={isSubmitting}
                        className="w-full py-4 bg-blue-600 text-white rounded-xl font-bold text-lg hover:bg-blue-700 active:scale-[0.98] transition-all disabled:opacity-70 flex justify-center items-center shadow-lg shadow-blue-500/30"
                      >
                        {isSubmitting ? (
                          <span className="animate-spin rounded-full h-6 w-6 border-b-2 border-white"></span>
                        ) : (
                          "Sauvegarder"
                        )}
                      </button>
                    </div>

                  </div>
                </div>
              )}

              {/* Modale de confirmation de suppression */}
              {itemToDelete && (
                <div className="fixed sm:absolute inset-0 z-[60] flex items-center justify-center p-4">
                  <div 
                    className="absolute inset-0 bg-black/60 backdrop-blur-sm transition-opacity"
                    onClick={() => setItemToDelete(null)}
                  ></div>
                  <div className="bg-white w-full max-w-sm rounded-3xl p-6 relative z-10 shadow-2xl">
                    <div className="w-12 h-12 rounded-full bg-red-100 flex items-center justify-center mx-auto mb-4 text-red-600">
                      <AlertTriangle className="h-6 w-6" />
                    </div>
                    <h3 className="text-xl font-bold text-center text-slate-800 mb-2">Confirmer la suppression</h3>
                    <p className="text-center text-slate-500 mb-6 text-sm sm:text-base">
                      Êtes-vous sûr de vouloir supprimer {itemToDelete.type === 'site' ? <strong>tout le site "{itemToDelete.siteName}"</strong> : <strong>l'accès "{itemToDelete.subMenu}"</strong>} ? Cette action est irréversible.
                    </p>
                    <div className="flex space-x-3">
                      <button 
                        onClick={() => setItemToDelete(null)}
                        className="flex-1 py-3 bg-slate-100 text-slate-700 font-semibold rounded-xl hover:bg-slate-200 transition-colors"
                      >
                        Annuler
                      </button>
                      <button 
                        onClick={confirmDelete}
                        className="flex-1 py-3 bg-red-600 text-white font-semibold rounded-xl hover:bg-red-700 transition-colors"
                      >
                        Supprimer
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {/* Notification Toast */}
              {toastMessage && (
                <div className="fixed sm:absolute top-6 left-1/2 -translate-x-1/2 z-50">
                  <div className="bg-slate-900 text-white px-6 py-3 rounded-full shadow-2xl flex items-center space-x-2 font-medium whitespace-nowrap">
                    <CheckCircle2 className="h-5 w-5 text-green-400" />
                    <span>{toastMessage}</span>
                  </div>
                </div>
              )}

            </div>
          </div>
        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
